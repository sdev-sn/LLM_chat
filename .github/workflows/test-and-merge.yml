name: Test and Auto-Merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install --upgrade pip && pip install pandas openpyxl pytest

      - name: Show installed versions
        run: pip list | grep -iE "pandas|openpyxl|pytest"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest_out.txt
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          cat /tmp/pytest_out.txt >> $GITHUB_STEP_SUMMARY
          grep -q "passed" /tmp/pytest_out.txt && exit 0 || exit 1

  auto-merge:
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Merge PR
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

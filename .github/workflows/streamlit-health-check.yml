name: Streamlit Health Check

on:
  push:
    branches: [main]

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Streamlit to redeploy
        run: sleep 60

      - name: Check Streamlit app is reachable
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://redditchat.streamlit.app/)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "403" ] || [ "$STATUS" = "302" ]; then
              echo "App is reachable (HTTP $STATUS)"
              exit 0
            fi
            sleep 30
          done
          echo "App did not respond after 10 attempts"
          exit 1
